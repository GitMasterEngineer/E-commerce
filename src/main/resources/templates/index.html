<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeLeaf.org" th:replace="~{base::Layout(~{::section})}">

<head>
	<meta charset="ISO-8859-1">
	<title>Insert title here</title>
</head>

<body>
	<section>
		<!--Start Slider -->
		<div id="carouselExample" class="carousel slide">
			<div class="carousel-inner">
				<div class="carousel-item active">
					<img src="img/ecom.png" class="d-block w-100" alt="..." height="350px">
				</div>
				<div class="carousel-item">
					<img src="img/ecom1.jpg" class="d-block w-100" alt="..." height="350px">
				</div>
				<div class="carousel-item">
					<img src="img/ecom2.jpg" class="d-block w-100" alt="..." height="350px">
				</div>
				<div class="carousel-item">
					<img src="img/ecom3.jpg" class="d-block w-100" alt="..." height="350px">
				</div>
			</div>
			<button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
				<span class="carousel-control-prev-icon" aria-hidden="true"></span>
				<span class="visually-hidden">Previous</span>
			</button>
			<button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
				<span class="carousel-control-next-icon" aria-hidden="true"></span>
				<span class="visually-hidden">Next</span>
			</button>
		</div>
		<!-- End Slider -->
		<!-- Category Module Start-->
		<div class="container">
			<div class="row">
				<p class="text-center fs-4">Category</p>
				<div class="col-md-2">
					<div class="card rounded-circle shadow p-3 mb-5 bg-body-tertiary rounded">
						<div class="card-body text-center">
							<img src="img/category_img/Electronics.jpg" width="65%" height="140px">
							<p>Electronics</p>

						</div>
					</div>
				</div>
				<div class="col-md-2">
					<div class="card rounded-circle shadow p-3 mb-5 bg-body-tertiary rounded">
						<div class="card-body text-center">
							<img src="img/category_img/laptop.jpg" width="65%" height="140px">
							<p>laptop</p>

						</div>
					</div>
				</div>
				<div class="col-md-2">
					<div class="card rounded-circle shadow p-3 mb-5 bg-body-tertiary rounded">
						<div class="card-body text-center">
							<img src="img/category_img/Cloth.jpg" width="65%" height="140px">
							<p>Clothes</p>

						</div>
					</div>
				</div>
				<div class="col-md-2">
					<div class="card rounded-circle shadow p-3 mb-5 bg-body-tertiary rounded">
						<div class="card-body text-center">
							<img src="img/category_img/Mobile.jpg" width="65%" height="140px">
							<p>Mobile</p>

						</div>
					</div>
				</div>
				<div class="col-md-2">
					<div class="card rounded-circle shadow p-3 mb-5 bg-body-tertiary rounded">
						<div class="card-body text-center">
							<img src="img/category_img/Fashion.jpg" width="65%" height="140px">
							<p>Fashion</p>

						</div>
					</div>
				</div>
				<div class="col-md-2">
					<div class="card rounded-circle shadow p-3 mb-5 bg-body-tertiary rounded">
						<div class="card-body text-center">
							<img src="img/category_img/Books.jpg" width="65%" height="140px">
							<p>Books</p>

						</div>
					</div>
				</div>
			</div>
		</div>


		<!-- Category Module End -->

		<!-- Start Latest Product Module-->
		<div class="container-fluid bg-light p-3">
			<div class="row">
				<p class="text-center fs-4">Latest Product</p>

				<div class="col-md-3">
					<div class="card shadow p-3 mb-5 bg-body-tertiary rounded">
						<div class="card-body text-center">
							<img alt="" src="img/product_img/Apple Laptop M2 2025.jpg" class="" width="65%"
								height="140px">
							<p class="text-center">HP Laptop</p>
						</div>

					</div>

				</div>
				<div class="col-md-3">
					<div class="card shadow p-3 mb-5 bg-body-tertiary rounded">
						<div class="card-body text-center">
							<img alt="" src="img/product_img/Asus Monitor.png" class="" width="65%" height="140px">
							<p class="text-center">ASUS Monitor</p>
						</div>

					</div>

				</div>
				<div class="col-md-3">
					<div class="card shadow p-3 mb-5 bg-body-tertiary rounded">
						<div class="card-body text-center">
							<img alt="" src="img/product_img/iphone 16 pro.jpg" class="" width="65%" height="140px">
							<p class="text-center">IPhone 16 Pro</p>
						</div>

					</div>

				</div>
				<div class="col-md-3">
					<div class="card shadow p-3 mb-5 bg-body-tertiary rounded">
						<div class="card-body text-center">
							<img alt="" src="img/product_img/Mac book Pro.jpg" class="" width="65%" height="140px">
							<p class="text-center">Mac Book Pro</p>
						</div>

					</div>

				</div>
			</div>
		</div>


		<!-- End Product Module-->
	</section>


</body>

</html>
